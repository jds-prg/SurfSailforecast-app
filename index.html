<script>
fetch('data_tides.json?v=' + Date.now())
    .then(response => {
        console.log("Status:", response.status);
        return response.text();
    })
    .then(text => {
        console.log("Wat wordt ontvangen:");
        console.log(text);

        const data = JSON.parse(text);

        console.log("JSON is geldig!");
        console.log(data);
    })
    .catch(error => {
        console.error("JSON FOUT:", error);
    });
</script>
